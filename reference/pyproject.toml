[project]
name = "ctms"
version = "0.1.0"
description = "CTMS reference implementation: signing and verification for MCP tool metadata"
requires-python = ">=3.10"
license = "Apache-2.0"

dependencies = [
    "rfc8785>=0.1.2",
    "sigstore>=3.0.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
ctms = "ctms.cli.main:cli"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
